app = "bioscale-sim-frontend"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

  [build.args]
    VITE_API_BASE = "https://bioscale-sim-backend.fly.dev"
    NGINX_CONF = "nginx.fly.conf"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
